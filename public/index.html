<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razq Store | منصة ألعاب</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<section class="hero">
  <div class="container">
    <h1>🎮 Razq Store</h1>
    <p>منصة ألعاب حصرية لقروبات الديسكورد — سجل دخولك وابدأ العب مع أعضاء السيرفر مباشرة.</p>
  </div>
</section>

<div class="container">
  <div id="logo-uploader" style="display:none; text-align:center; margin-bottom:20px;">
    <button class="btn btn-sm" id="open-logo-modal">تغيير لوقو الموقع</button>
  </div>
</div>

<div class="container">
  <div class="games-grid" id="games-grid"></div>
</div>

<div class="footer">Razq Store © <span id="year"></span></div>

<div id="toast"></div>

<div class="modal-overlay" id="logo-modal">
  <div class="modal-box">
    <h3>لوقو Razq Store</h3>
    <img class="logo-preview" id="logo-preview" src="" style="display:none;">
    <p style="color:var(--text-2); font-size:13px;">اختر صورة لتكون لوقو الموقع الظاهر بالأعلى</p>
    <input type="file" id="logo-input" accept="image/*" style="margin:10px 0;">
    <div class="actions-row">
      <button class="btn btn-accent" id="logo-save">حفظ</button>
      <button class="btn btn-ghost" id="logo-cancel">إلغاء</button>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
RZ.renderHeader();

RZ.fetchMe().then(user => {
  document.getElementById('logo-uploader').style.display = user ? 'block' : 'none';
});

fetch('/api/games').then(r => r.json()).then(({ games }) => {
  const grid = document.getElementById('games-grid');
  grid.innerHTML = Object.values(games).map(g => `
    <a class="game-card" href="/games/${g.id}.html">
      <div class="game-icon">${g.icon}</div>
      <div class="game-title">${g.name}</div>
      <div class="game-desc">${g.desc}</div>
      <div class="game-players">من ${g.min} إلى ${g.max} لاعبين</div>
    </a>
  `).join('');
});

// logo modal
const modal = document.getElementById('logo-modal');
document.getElementById('open-logo-modal').onclick = () => modal.classList.add('show');
document.getElementById('logo-cancel').onclick = () => modal.classList.remove('show');
document.getElementById('logo-input').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const preview = document.getElementById('logo-preview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'inline-block';
};
document.getElementById('logo-save').onclick = async () => {
  const input = document.getElementById('logo-input');
  if (!input.files[0]) return RZ.toast('اختر صورة أولاً');
  const fd = new FormData();
  fd.append('logo', input.files[0]);
  const res = await fetch('/api/logo', { method: 'POST', body: fd });
  const data = await res.json();
  if (data.ok) {
    RZ.toast('تم تحديث اللوقو');
    modal.classList.remove('show');
    location.reload();
  } else {
    RZ.toast(data.error || 'صار خطأ');
  }
};
</script>
</body>
</html>
